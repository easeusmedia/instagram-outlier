<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kompass — Sign in</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #05070a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #EDF1F7;
  }
  .card {
    width: 320px;
    padding: 32px 28px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #8A93A3; font-size: 13px; margin: 0 0 20px; }
  a.google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #1f1f1f;
    border-radius: 10px; padding: 11px 16px;
    text-decoration: none; font-weight: 500; font-size: 14px;
  }
  a.google-btn:hover { background: #f1f1f1; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: #5B6472; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.09); }
  form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  input {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; padding: 10px 12px; color: #EDF1F7; font-size: 13px;
    outline: none; font-family: inherit;
  }
  input:focus { border-color: rgba(255,255,255,0.3); }
  input.invalid { border-color: #FF6B6B; }
  input.invalid:focus { border-color: #FF6B6B; box-shadow: 0 0 0 3px rgba(255,107,107,0.18); }
  button[type="submit"] {
    background: #EDF1F7; color: #05070a; border: none; border-radius: 9px;
    padding: 6px 12px; font-weight: 500; font-size: 13px; cursor: pointer; margin-top: 4px;
  }
  button[type="submit"]:hover { background: #cfd6e0; }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  .toggle { margin-top: 14px; font-size: 12px; color: #8A93A3; }
  .toggle button { background: none; border: none; color: #4C8DFF; cursor: pointer; font-size: 12px; padding: 0; text-decoration: underline; }
  /* Sits right under the button that triggered it (it's now a flex child
     of the form itself), not down past the divider and Google button
     where it used to live — same fix as the earlier "Name saved" mix-up
     in Account settings: keep feedback next to what caused it. */
  #msg { display: none; color: #FF6B6B; font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Kompass</h1>
    <p id="subtitle">Sign in to continue</p>

    <form id="authForm" novalidate>
      <input type="email" id="email" placeholder="Email" autocomplete="email" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required minlength="8" />
      <button type="submit" id="submitBtn">Sign in</button>
      <div id="msg"></div>
    </form>
    <div class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <button type="button" id="toggleMode">Sign up</button>
    </div>

    <div class="divider" id="google-divider">or</div>
    <a class="google-btn" id="google-btn" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.94A9 9 0 000 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
  </div>
  <script>
    let mode = 'login';
    const form = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('toggleMode');
    const toggleText = document.getElementById('toggleText');
    const subtitle = document.getElementById('subtitle');
    const msg = document.getElementById('msg');
    const emailInput = document.getElementById('email');
    const pwInput = document.getElementById('password');

    function showMsg(text) {
      msg.textContent = text;
      msg.style.display = text ? 'block' : 'none';
    }

    // Replaces the browser's own native "Please fill in this field" bubble
    // (novalidate on the form suppresses it) — that bubble is unstyled OS
    // chrome no CSS here can reach, so a real fix means owning the message
    // ourselves instead of trying to reskin something unstyleable.
    [emailInput, pwInput].forEach((input) => {
      input.addEventListener('input', () => input.classList.remove('invalid'));
    });
    function markInvalid(input, text) {
      input.classList.add('invalid');
      input.focus();
      showMsg(text);
    }

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      const isSignup = mode === 'signup';
      submitBtn.textContent = isSignup ? 'Create account' : 'Sign in';
      subtitle.textContent = isSignup ? 'Create an account to continue' : 'Sign in to continue';
      toggleText.textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
      toggleBtn.textContent = isSignup ? 'Sign in' : 'Sign up';
      pwInput.autocomplete = isSignup ? 'new-password' : 'current-password';
      showMsg('');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMsg('');
      emailInput.classList.remove('invalid');
      pwInput.classList.remove('invalid');
      const email = emailInput.value.trim();
      const password = pwInput.value;
      if (!email) return markInvalid(emailInput, 'Enter your email.');
      if (!password) return markInvalid(pwInput, 'Enter your password.');
      if (mode === 'signup' && password.length < 8) {
        return markInvalid(pwInput, 'Password must be at least 8 characters.');
      }
      submitBtn.disabled = true;
      try {
        const res = await fetch(mode === 'signup' ? '/auth/signup' : '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        location.href = '/';
      } catch (err) {
        showMsg(err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });

    if (new URLSearchParams(location.search).get('denied')) {
      showMsg("That Google account isn't authorized for this app.");
    }

    // Testing phase: email/password only, no Google sign-in.
    fetch('/api/me').then((r) => r.json()).then((data) => {
      if (data.betaMode) {
        document.getElementById('google-divider').style.display = 'none';
        document.getElementById('google-btn').style.display = 'none';
      }
    }).catch(() => {});
  </script>
</body>
</html>
