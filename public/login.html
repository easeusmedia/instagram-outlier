<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram Outlier — Sign in</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #05070a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #EDF1F7;
  }
  .card {
    width: 320px;
    padding: 32px 28px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #8A93A3; font-size: 13px; margin: 0 0 24px; }
  a.google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #1f1f1f;
    border-radius: 10px; padding: 11px 16px;
    text-decoration: none; font-weight: 600; font-size: 14px;
  }
  a.google-btn:hover { background: #f1f1f1; }
  #denied { display: none; color: #ff5c5c; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Instagram Outlier</h1>
    <p>Sign in to continue</p>
    <a class="google-btn" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.94A9 9 0 000 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
    <div id="denied">That Google account isn't authorized for this app.</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('denied')) {
      document.getElementById('denied').style.display = 'block';
    }
  </script>
</body>
</html>
