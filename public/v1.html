<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instagram Outlier — v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
<style>
  :root {
    --bg: #05070a;
    --card: rgba(255,255,255,0.035);
    --card-border: rgba(255,255,255,0.09);
    --card-border-hover: rgba(255,255,255,0.18);
    --accent: #00AAFF;
    --text: #EDF1F7;
    --muted: #8A93A3;
    --muted-dim: #5b6472;
    --danger: #ff5c5c;
    --btn-bg: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    --btn-bg-hover: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.2));
    --btn-border: rgba(255,255,255,0.14);
    --glass-blur: blur(20px) saturate(160%);
    --hover-glow: 0 4px 14px -2px rgba(0,170,255,0.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  button, input, textarea { font-family: inherit; }
  button, .icon-btn { position: relative; cursor: pointer; }
  button::after, .icon-btn::after {
    content: ''; position: absolute; left: 50%; bottom: -7px; width: 65%; height: 10px;
    transform: translateX(-50%); background: var(--accent); filter: blur(7px); border-radius: 50%;
    opacity: 0; transition: opacity .25s ease; pointer-events: none;
  }
  button:hover::after, .icon-btn:hover::after { opacity: 0.5; }

  .icon-btn {
    background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); color: var(--muted);
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s, background .2s, box-shadow .25s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--card-border-hover); background: rgba(0,0,0,0.2); }
  .icon { vertical-align: -3px; flex-shrink: 0; position: static !important; }

  button.primary {
    background: var(--btn-bg); color: var(--text); border: 1px solid var(--btn-border);
    padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13px;
    transition: background .2s, box-shadow .2s;
  }
  button.primary:hover { background: var(--btn-bg-hover); box-shadow: var(--hover-glow); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.primary:disabled::after { display: none; }

  button.secondary {
    background: rgba(255,255,255,0.03); border: 1px solid var(--card-border-hover); color: var(--text);
    padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 12px;
    transition: background .2s, box-shadow .2s;
  }
  button.secondary:hover { background: rgba(0,0,0,0.25); box-shadow: var(--hover-glow); }
  button.secondary.active { background: var(--accent); border-color: var(--accent); color: #04121c; }

  input[type="text"], textarea {
    background: rgba(255,255,255,0.08); border: 1px solid var(--card-border-hover); color: var(--text);
    padding: 10px 12px; border-radius: 9px; font-size: 13px; width: 100%;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }

  /* --- spaces landing view ------------------------------------------- */
  #spaces-view { height: 100%; overflow-y: auto; padding: 40px; }
  .spaces-header { display: flex; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto 28px; }
  .spaces-header h1 { font-size: 22px; margin: 0; }
  .spaces-header h1 a { color: var(--muted); text-decoration: none; font-size: 14px; margin-left: 14px; }
  .spaces-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .space-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px;
    cursor: pointer; transition: border-color .2s, background .2s; position: relative;
  }
  .space-card:hover { border-color: var(--card-border-hover); background: rgba(255,255,255,0.05); }
  .space-card h3 { margin: 0 0 6px; font-size: 15px; }
  .space-card .date { color: var(--muted); font-size: 12px; }
  .space-card .del { position: absolute; top: 10px; right: 10px; opacity: 0; width: 26px; height: 26px; }
  .space-card:hover .del { opacity: 1; }
  .space-card.new-space {
    display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted);
    border-style: dashed; font-weight: 600; font-size: 13px;
  }
  .space-card.new-space:hover { color: var(--text); }
  .empty-note { color: var(--muted); font-size: 13px; grid-column: 1 / -1; text-align: center; padding: 40px 0; }

  /* --- canvas view ----------------------------------------------------- */
  #canvas-view { height: 100%; display: flex; flex-direction: column; }
  .canvas-header {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    background: rgba(5,7,10,0.75); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--card-border); flex-shrink: 0; z-index: 5;
  }
  .canvas-header .brand { font-weight: 700; font-size: 15px; }
  .canvas-header .brand span { color: var(--accent); }
  .canvas-header h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .canvas-header .save-status { color: var(--muted-dim); font-size: 12px; margin-left: auto; }

  .canvas-layout { flex: 1; display: flex; min-height: 0; }
  #drawflow { flex: 1; position: relative; background: var(--bg); }
  .parent-drawflow { background: transparent !important; }
  /* Drawflow's own stylesheet uses nested selectors like ".drawflow .drawflow-node",
     which beats a bare ".drawflow-node" override on specificity regardless of CSS
     source order — so every override below matches that same nesting depth. */
  .drawflow {
    background-image: radial-gradient(rgba(255,255,255,0.09) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .drawflow .drawflow-node {
    background: rgba(14,17,23,0.92); border: 1px solid var(--card-border); border-radius: 14px;
    color: var(--text); padding: 0; width: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);
  }
  .drawflow .drawflow-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,170,255,0.3), 0 10px 30px rgba(0,0,0,0.45); }
  .drawflow .drawflow-node:hover { cursor: move; }
  .drawflow .drawflow-node .drawflow_content_node { width: 100%; }
  .drawflow .drawflow-node .input, .drawflow .drawflow-node .output {
    background: var(--accent); border: 2px solid rgba(5,7,10,0.95); width: 14px; height: 14px;
  }
  .drawflow .drawflow-node .input { left: -7px; }
  .drawflow .drawflow-node .output { right: -7px; }
  .drawflow .connection .main-path { stroke: rgba(0,170,255,0.6); stroke-width: 2.5px; }
  .drawflow .connection .main-path:hover { stroke: var(--accent); }
  .drawflow .connection .main-path.selected { stroke: #34d399; }
  .drawflow-delete {
    background: rgba(20,20,24,0.95) !important; color: var(--text) !important; border: 1px solid var(--card-border-hover) !important;
    width: 22px !important; height: 22px !important; border-radius: 50% !important; font-size: 12px !important; line-height: 20px !important;
    top: -11px !important; right: -11px !important;
  }

  .video-node { width: 200px; }
  .video-node .thumb { width: 100%; height: 150px; object-fit: cover; border-radius: 14px 14px 0 0; display: block; background: rgba(255,255,255,0.04); pointer-events: none; }
  .video-node .score {
    position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 6px;
  }
  .video-node .body { padding: 10px 12px 12px; }
  .video-node .handle { font-size: 12px; font-weight: 600; color: var(--accent); }
  .video-node .views { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .chat-node { width: 320px; }
  .chat-node .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--card-border); font-weight: 700; font-size: 13px; }
  .chat-node .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .chat-node textarea { min-height: 60px; resize: vertical; }
  .chat-node .output-box { min-height: 100px; max-height: 260px; overflow-y: auto; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 9px; padding: 10px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  .chat-node .row { display: flex; gap: 8px; }
  .chat-node .row button { flex: 1; }
  .chat-node .status { font-size: 11px; color: var(--muted); min-height: 14px; }
  .chat-node .status.error { color: var(--danger); }

  /* --- search panel ------------------------------------------------- */
  .search-panel {
    width: 340px; flex-shrink: 0; background: var(--card); border-left: 1px solid var(--card-border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .search-panel .panel-head { padding: 16px 16px 0; }
  .search-panel .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-panel .sort-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-panel .sort-row button { flex: 1; }
  .search-panel .status { color: var(--muted); font-size: 12px; padding: 0 16px 10px; min-height: 14px; }
  .search-panel .status.error { color: var(--danger); }
  .search-results { flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .search-card {
    display: flex; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
    border-radius: 10px; padding: 8px; cursor: grab; transition: border-color .2s, box-shadow .2s;
  }
  .search-card:hover { border-color: var(--accent); box-shadow: var(--hover-glow); }
  .search-card.dragging { opacity: 0.4; }
  .search-card img { width: 52px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: rgba(255,255,255,0.05); }
  .search-card .info { min-width: 0; }
  .search-card .cap { font-size: 12px; color: var(--text); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .search-card .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; }
  .search-card .meta .score { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<div id="spaces-view">
  <div class="spaces-header">
    <h1>Instagram Outlier <a href="/">&larr; back to base app</a></h1>
  </div>
  <div class="spaces-grid" id="spaces-grid"></div>
</div>

<div id="canvas-view" style="display:none">
  <div class="canvas-header">
    <button class="icon-btn" id="back-btn" title="Back to spaces"></button>
    <div class="brand">Instagram <span>Outlier</span></div>
    <h2 id="space-name"></h2>
    <div class="save-status" id="save-status"></div>
  </div>
  <div class="canvas-layout">
    <div id="drawflow"></div>
    <aside class="search-panel">
      <div class="panel-head">
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Search a creator…" />
          <button class="primary" id="search-btn">Go</button>
        </div>
        <div class="sort-row">
          <button class="secondary active" id="sort-outlier">Outlier</button>
          <button class="secondary" id="sort-latest">Latest</button>
        </div>
      </div>
      <div class="status" id="search-status"></div>
      <div class="search-results" id="search-results"></div>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);

const ICONS = {
  close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  sparkle: '<path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z" fill="currentColor" stroke="none"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9L19 15z" fill="currentColor" stroke="none" opacity="0.7"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
};
function icon(name, { size = 16 } = {}) {
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
$('back-btn').innerHTML = icon('back', { size: 18 });

async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
function proxied(url) { return url ? `/api/image-proxy?url=${encodeURIComponent(url)}` : ''; }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function fmtNum(n) {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}
function imgFallback(el) {
  el.onerror = null;
  el.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="52" height="68"><rect width="100%" height="100%" fill="#0d1117"/></svg>'
  );
}

// --- spaces landing view -------------------------------------------------

async function loadSpacesView() {
  const { spaces } = await fetchJSON('/api/spaces');
  const grid = $('spaces-grid');
  grid.innerHTML = '';

  const newCard = document.createElement('div');
  newCard.className = 'space-card new-space';
  newCard.innerHTML = `${icon('plus', { size: 18 })} Create new space`;
  newCard.addEventListener('click', async () => {
    const name = prompt('Name this space:');
    if (!name || !name.trim()) return;
    const { id } = await fetchJSON('/api/spaces', { method: 'POST', body: { name: name.trim() } });
    location.href = `/v1?space=${id}`;
  });
  grid.appendChild(newCard);

  if (!spaces.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No spaces yet — create one to start building a script canvas.';
    grid.appendChild(note);
  }

  spaces.forEach((s) => {
    const card = document.createElement('div');
    card.className = 'space-card';
    card.innerHTML = `
      <h3>${escapeHtml(s.name)}</h3>
      <div class="date">${new Date(s.created_at).toLocaleDateString()}</div>
      <button class="icon-btn del" title="Delete space">${icon('close', { size: 12 })}</button>
    `;
    card.addEventListener('click', () => { location.href = `/v1?space=${s.id}`; });
    card.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete "${s.name}"? This can't be undone.`)) return;
      await fetchJSON(`/api/spaces/${s.id}`, { method: 'DELETE' });
      loadSpacesView();
    });
    grid.appendChild(card);
  });
}

// --- canvas view -----------------------------------------------------------

const state = { spaceId: null, editor: null, chatNodeId: null, sortMode: 'outlier', results: [] };

function nodeIcon(name, size) { return icon(name, { size }); }

function buildVideoNodeHtml(r) {
  const thumb = proxied(r.thumbnail);
  return `
    <div class="video-node">
      <span class="score">${r.outlierScore != null ? r.outlierScore.toFixed(1) + '×' : '—'}</span>
      <img class="thumb" src="${thumb}" onerror="imgFallback(this)" />
      <div class="body">
        <div class="handle">@${escapeHtml(r.handle || '')}</div>
        <div class="views">${fmtNum(r.views)} views</div>
      </div>
    </div>
  `;
}

function buildChatNodeHtml() {
  return `
    <div class="chat-node">
      <div class="head">${nodeIcon('sparkle', 16)} AI Assistant</div>
      <div class="body">
        <textarea placeholder="What do you want it to write? (optional)" class="chat-prompt"></textarea>
        <div class="row"><button class="primary chat-generate">Generate Script</button></div>
        <div class="status chat-status"></div>
        <div class="output-box chat-output" style="display:none"></div>
        <div class="row chat-output-actions" style="display:none"><button class="secondary chat-copy">Copy</button></div>
      </div>
    </div>
  `;
}

function findChatNodeId() {
  const data = state.editor.drawflow.drawflow.Home.data;
  for (const id in data) {
    if (data[id].class === 'chat-node') return Number(id);
  }
  return null;
}

function wireChatNode(nodeId) {
  const el = document.getElementById(`node-${nodeId}`);
  if (!el || el.dataset.wired) return;
  el.dataset.wired = '1';
  const promptEl = el.querySelector('.chat-prompt');
  const statusEl = el.querySelector('.chat-status');
  const outputEl = el.querySelector('.chat-output');
  const copyBtn = el.querySelector('.chat-copy');
  const genBtn = el.querySelector('.chat-generate');

  genBtn.addEventListener('click', async () => {
    statusEl.textContent = '';
    statusEl.classList.remove('error');
    const connections = state.editor.drawflow.drawflow.Home.data[nodeId].inputs.input_1?.connections || [];
    if (!connections.length) {
      statusEl.textContent = 'Connect at least one video to this node first.';
      statusEl.classList.add('error');
      return;
    }
    genBtn.disabled = true;
    genBtn.textContent = 'Generating…';
    try {
      const items = [];
      for (const conn of connections) {
        const vData = state.editor.drawflow.drawflow.Home.data[conn.node]?.data;
        if (!vData) continue;
        let transcript = vData.transcript;
        if (!transcript) {
          statusEl.textContent = `Fetching transcript for @${vData.handle}…`;
          const t = await fetchJSON(`/api/transcript?input=${encodeURIComponent(vData.url)}`);
          transcript = t.transcript;
          state.editor.updateNodeDataFromId(conn.node, { ...vData, transcript });
        }
        if (transcript) items.push({ shortCode: vData.shortCode, handle: vData.handle, content: transcript });
      }
      if (!items.length) throw new Error('Could not fetch a transcript for any connected video.');
      statusEl.textContent = 'Generating script…';
      const { script } = await fetchJSON('/api/generate-script', { method: 'POST', body: { prompt: promptEl.value.trim(), items } });
      outputEl.textContent = script;
      outputEl.style.display = 'block';
      copyBtn.parentElement.style.display = 'flex';
      statusEl.textContent = '';
      saveCanvasState();
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.classList.add('error');
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = 'Generate Script';
    }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputEl.textContent);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
  });
}

function ensureChatNode() {
  let id = findChatNodeId();
  if (id == null) {
    id = state.editor.addNode('chat', 1, 0, 520, 140, 'chat-node', {}, buildChatNodeHtml());
  }
  state.chatNodeId = id;
  wireChatNode(id);
}

let saveTimer = null;
function saveCanvasState() {
  $('save-status').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetchJSON(`/api/spaces/${state.spaceId}`, { method: 'PUT', body: { canvasState: state.editor.export() } });
      $('save-status').textContent = 'Saved';
      setTimeout(() => { if ($('save-status').textContent === 'Saved') $('save-status').textContent = ''; }, 1500);
    } catch {
      $('save-status').textContent = 'Save failed';
    }
  }, 500);
}

function initEditor() {
  const container = $('drawflow');
  const editor = new Drawflow(container);
  editor.reroute = true;
  editor.start();
  state.editor = editor;

  editor.on('nodeCreated', () => saveCanvasState());
  editor.on('nodeRemoved', () => saveCanvasState());
  editor.on('nodeMoved', () => saveCanvasState());
  editor.on('connectionCreated', () => saveCanvasState());
  editor.on('connectionRemoved', () => saveCanvasState());

  container.addEventListener('dragover', (e) => e.preventDefault());
  container.addEventListener('drop', (e) => {
    e.preventDefault();
    const raw = e.dataTransfer.getData('application/json');
    if (!raw) return;
    const r = JSON.parse(raw);
    const rect = container.getBoundingClientRect();
    const zoom = editor.zoom;
    const posX = (e.clientX - rect.left) / zoom - editor.canvas_x / zoom;
    const posY = (e.clientY - rect.top) / zoom - editor.canvas_y / zoom;
    editor.addNode(r.shortCode, 0, 1, posX, posY, 'video-node', r, buildVideoNodeHtml(r));
  });

  return editor;
}

async function openSpace(id) {
  state.spaceId = id;
  $('spaces-view').style.display = 'none';
  $('canvas-view').style.display = 'flex';

  const space = await fetchJSON(`/api/spaces/${id}`);
  $('space-name').textContent = space.name;
  document.title = `${space.name} — Instagram Outlier v1`;

  initEditor();
  if (space.canvasState) {
    state.editor.import(space.canvasState);
    // Re-wire any chat node(s) restored from the saved state.
    Object.keys(state.editor.drawflow.drawflow.Home.data).forEach((id) => {
      if (state.editor.drawflow.drawflow.Home.data[id].class === 'chat-node') wireChatNode(Number(id));
    });
  }
  ensureChatNode();
}

$('back-btn').addEventListener('click', () => { location.href = '/v1'; });

// --- creator search panel -------------------------------------------------

function renderResults() {
  const list = (state.sortMode === 'outlier'
    ? [...state.results].sort((a, b) => (b.outlierScore ?? -1) - (a.outlierScore ?? -1))
    : [...state.results].sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0))
  ).slice(0, 15); // v1 only ever shows the top 15, however many came back from cache

  const container = $('search-results');
  container.innerHTML = '';
  list.forEach((r) => {
    const card = document.createElement('div');
    card.className = 'search-card';
    card.draggable = true;
    card.innerHTML = `
      <img src="${proxied(r.thumbnail)}" onerror="imgFallback(this)" />
      <div class="info">
        <div class="cap">${escapeHtml(r.caption || '(no caption)')}</div>
        <div class="meta"><span class="score">${r.outlierScore != null ? r.outlierScore.toFixed(1) + '×' : '—'}</span><span>${fmtNum(r.views)} views</span></div>
      </div>
    `;
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('application/json', JSON.stringify({
        shortCode: r.shortCode, handle: r.handle, url: r.url, thumbnail: r.thumbnail,
        views: r.views, outlierScore: r.outlierScore, caption: r.caption, transcript: null,
      }));
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    container.appendChild(card);
  });
}

async function searchCreator() {
  const input = $('search-input').value.trim();
  const statusEl = $('search-status');
  if (!input) { statusEl.textContent = 'Enter a username.'; return; }
  statusEl.textContent = 'Loading…';
  statusEl.classList.remove('error');
  $('search-results').innerHTML = '';
  try {
    const data = await fetchJSON(`/api/creator?input=${encodeURIComponent(input)}&limit=15`);
    state.results = data.reels.map((r) => ({ ...r, handle: data.profile.handle }));
    statusEl.textContent = `${state.results.length} videos`;
    renderResults();
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.classList.add('error');
  }
}
$('search-btn').addEventListener('click', searchCreator);
$('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchCreator(); });
$('sort-outlier').addEventListener('click', () => {
  state.sortMode = 'outlier';
  $('sort-outlier').classList.add('active');
  $('sort-latest').classList.remove('active');
  renderResults();
});
$('sort-latest').addEventListener('click', () => {
  state.sortMode = 'latest';
  $('sort-latest').classList.add('active');
  $('sort-outlier').classList.remove('active');
  renderResults();
});

// --- boot -------------------------------------------------------------

const spaceId = new URLSearchParams(location.search).get('space');
if (spaceId) openSpace(Number(spaceId));
else loadSpacesView();
</script>
</body>
</html>
